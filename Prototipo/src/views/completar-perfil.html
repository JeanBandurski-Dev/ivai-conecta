<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete seu Perfil | Ivaí Conecta</title>
  <meta name="description" content="Finalize seu cadastro no Ivaí Conecta informando nome, cidade e perfil de acesso.">
  <link rel="stylesheet" href="../../public/css/styles.css?v=3">
  <script type="module" src="../../public/js/app.js?v=3"></script>
  <style>
    .complete-container {
      max-width: 520px;
      margin: 3rem auto;
      background: var(--white);
      border-radius: var(--radius-xl);
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow-xl);
      padding: 2.5rem 2rem;
    }

    .role-cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .role-card-option {
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
      background: var(--gray-50);
    }

    .role-card-option:hover,
    .role-card-option.selected {
      border-color: var(--primary-blue);
      background: var(--primary-light);
    }

    .role-card-option .role-title {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--primary-dark);
    }
  </style>
</head>

<body>

  <!-- NAVBAR (sem link de login, usuário já está autenticado nesse ponto) -->
  <nav class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="logo-brand">
        <svg class="logo-brand-svg" width="46" height="42" viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="8" fill="#0052FF"/>
          <rect x="9" y="32" width="14" height="48" rx="7" fill="#0052FF"/>
          <path d="M 72 26 C 55 12 36 24 36 50 C 36 76 56 86 78 76" stroke="#0052FF" stroke-width="14" stroke-linecap="round" fill="none"/>
          <line x1="56" y1="36" x2="72" y2="20" stroke="#0052FF" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="72" y1="20" x2="88" y2="40" stroke="#0052FF" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="56" y1="36" x2="88" y2="40" stroke="#0052FF" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="72" cy="20" r="7" fill="#22C55E"/>
          <circle cx="56" cy="36" r="6" fill="#0052FF"/>
          <circle cx="88" cy="40" r="6" fill="#0052FF"/>
        </svg>
        <span><span class="logo-ivai">Ivaí</span> <span class="logo-conecta">Conecta</span></span>
      </a>
    </div>
  </nav>

  <main class="container section">
    <div class="complete-container">
      <h2 style="font-size: 1.6rem; color: var(--primary-dark); margin-bottom: 0.35rem;">Falta pouco!</h2>
      <p style="font-size: 0.9rem; color: var(--gray-500); margin-bottom: 1.75rem;">
        Sua conta Google foi conectada. Complete os dados abaixo para finalizar seu cadastro no Ivaí Conecta.
      </p>

      <div id="completeAlertBox"
        style="display: none; padding: 0.85rem 1rem; border-radius: var(--radius-md); background: #FEE2E2; border: 1px solid #FCA5A5; color: #991B1B; font-size: 0.875rem; font-weight: 600; margin-bottom: 1.25rem; line-height: 1.4;">
      </div>

      <form id="completeProfileForm">
        <label style="display: block; font-weight: 700; font-size: 0.875rem; color: var(--gray-700); margin-bottom: 0.5rem;">
          Selecione o seu Perfil de Acesso:
        </label>

        <div class="role-cards-grid">
          <div class="role-card-option selected" data-role="aluno">
            <span class="role-title">Aluno / Estudante</span>
          </div>
          <div class="role-card-option" data-role="freelancer">
            <span class="role-title">Freelancer / Autônomo</span>
          </div>
          <div class="role-card-option" data-role="candidato">
            <span class="role-title">Candidato Geral</span>
          </div>
          <div class="role-card-option" data-role="empresa">
            <span class="role-title">Empresa / Recrutador</span>
          </div>
        </div>

        <div class="form-group">
          <label for="completeName">Nome Completo ou Razão Social</label>
          <input type="text" id="completeName" class="form-control" placeholder="Ex: Lucas Silva ou ValeTech Soluções" required>
        </div>

        <div class="form-group">
          <label for="completeCity">Sua Cidade no Vale do Ivaí</label>
          <select id="completeCity" class="form-control" required>
            <option value="Ivaiporã">Ivaiporã</option>
            <option value="Jardim Alegre">Jardim Alegre</option>
            <option value="São João do Ivaí">São João do Ivaí</option>
            <option value="Manoel Ribas">Manoel Ribas</option>
            <option value="Lunardelli">Lunardelli</option>
            <option value="Borrazópolis">Borrazópolis</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 0.5rem;">
          Concluir Cadastro
        </button>
      </form>
    </div>
  </main>

  <script type="module">
    import { watchAuthState, completeUserProfile, logoutUser } from '../database/auth-service.js';

    let selectedRole = 'aluno';
    let currentUser = null;

    const alertBox = document.getElementById('completeAlertBox');
    const nameInput = document.getElementById('completeName');

    function showAlert(msg) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
    }

    // Protege a página: sem usuário logado, não tem o que completar aqui
    watchAuthState((user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      // Pré-preenche com o nome que veio do Google, se houver (usuário pode editar)
      if (user.displayName) {
        nameInput.value = user.displayName;
      }
    });

    document.querySelectorAll('.role-card-option').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.role-card-option').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedRole = card.getAttribute('data-role');
      });
    });

    document.getElementById('completeProfileForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!currentUser) {
        showAlert('Sessão não encontrada. Faça login novamente.');
        return;
      }

      const name = nameInput.value.trim();
      const city = document.getElementById('completeCity').value;

      const response = await completeUserProfile(currentUser.uid, {
        name,
        email: currentUser.email,
        city,
        role: selectedRole
      });

      if (!response.success) {
        showAlert('Não foi possível salvar seu perfil. Tente novamente.');
        return;
      }

      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
